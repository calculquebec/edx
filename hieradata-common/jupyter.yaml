jupyterhub::authenticator_class: "ipa-lti11"
jupyterhub::spawner_class: "slurmformspawner.SlurmFormSpawner"
jupyterhub::idle_timeout: 1800

jupyterhub::jupyterhub_config_hash:
  LTI11Authenticator:
    consumers: { 'openedx': "%{lookup('lti_consumer_key')}" }
    username_key: 'lis_person_sourcedid'
  LocalAuthenticator:
    create_system_users: true
    default_group: ''
  SlurmFormSpawner:
    start_timeout: 900
    http_timeout: 900
    ui_args:
      lab:
        modules: ['jupyterlab-apps']
    profile_args:
      CIP101:
        name: 'CIP101 - Premiers pas sur les superordinateurs'
        params: 
          nprocs: 1
          runtime: 3
          memory: '512'
          oversubscribe: true
          ui: 'terminal'
          partition: 'node'
  SbatchForm:
    account:
      def: 'def-sponsor00'
      lock: true
    runtime:
      min: 3.5
      def: 4.0
      max: 5.0
      lock: true
    nprocs:
      min: 1
      def: 1
      max: 4
      lock: true
    memory:
      min: 1024
      max: 2048
      def: 2048
      lock: true
    oversubscribe:
      def: true
      lock: true
    ui:
      def: 'lab'
      lock: true
    gpus:
      lock: true
    reservation:
      lock: true
    profile:
      def: 'CIP101'
      choices: ['CIP101']
    partition:
      lock: false
  JupyterHub:
    shutdown_on_logout: true
    tornado_settings:
      headers:
        "Content-Security-Policy": "frame-ancestors 'self' https://*.%{lookup('terraform.data.domain_name')};"
      cookie_options:
        "SameSite": "None"
        "Secure": true
  ServerApp:
    nbserver_extensions: { "nbgitpuller": True }
    logging_config:
      handlers:
        logfile:
          class: "logging.FileHandler"
          level: "DEBUG"
          filename: "jupyter_server.log"
      loggers:
        ServerApp:
          level: "DEBUG"
          handlers:
            - "console"
            - "logfile"

jupyterhub::jupyter_notebook_config_hash:
  ServerApp:
    disable_check_xsrf: true
    tornado_settings:
      headers:
        "Content-Security-Policy": "frame-ancestors 'self' https://*.%{lookup('terraform.data.domain_name')};"

# StdEnv/2023 and mii are automatically loaded
lookup_options:
  profile::software_stack::lmod_default_modules:
    merge: first

profile::software_stack::initial_profile: /home/.skel/.bashrc

  #jupyterhub::node::install_method: 'none'
  #jupyterhub::node::prefix: /cvmfs/soft.computecanada.ca/easybuild/software/2023/x86-64-v3/Core/jupyterhub_node/7.0.1
jupyterhub::kernel::venv::kernel_name: 'ospython'
jupyterhub::kernel::venv::display_name: 'Python bundle'

jupyterhub::kernel::venv::pip_environment:
  PIP_NO_INDEX: 1
jupyterhub::kernel::venv::packages:
  - numpy>2
  - pandas==2.2.3
  - matplotlib==3.10.0
  - plotnine==0.14.1
  - altair==5.4.1
  - vega_datasets
  - vl_convert_python
