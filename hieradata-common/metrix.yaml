mysql::server::override_options:
  mysqld:
    bind-address: "0.0.0.0"

metrix::slurm_db_ip: "%{lookup('terraform.tag_ip.mgmt.0')}"
metrix::slurm_password: "%{alias('metrix_slurm_password')}"

metrix::auth_type: 'oauth2jwt'
metrix::auth::oauth2jwt::authorization_url: "https://edx.%{lookup('terraform.data.domain_name')}/oauth2/authorize/"
metrix::auth::oauth2jwt::token_url: "https://edx.%{lookup('terraform.data.domain_name')}/oauth2/access_token/"
metrix::auth::oauth2jwt::client_id: "BVkQ3RTppNvyiKZ1zwzDV2eu0zTnCvj0kaNerc6D"
metrix::auth::oauth2jwt::client_secret: "%{alias('metrix_oauth2jwt_client_secret')}"
metrix::auth::oauth2jwt::extra_token_params:
  'token_type': 'jwt'
metrix::auth::oauth2jwt::proxied: true
metrix::required_access_attributes:
  - is_restricted: 'False'
metrix::staff_attributes:
  - administrator: 'True'
    superuser: 'True'

metrix::slurm_db_ip: "%{lookup('terraform.tag_ip.mgmt.0')}"
metrix::slurm_password: "%{alias('metrix_slurm_password')}"

profile::slurm::accounting::db_users:
  - username: "%{alias('metrix::slurm_user')}"
    password: "%{alias('metrix::slurm_password')}"
    privileges: ['SELECT']
    host: "%{lookup('terraform.tag_ip.metrix.0')}"

