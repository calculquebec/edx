restic::repositories:
  backup_edx_repo_juno:
    enable_backup: true
    id: "e0878921516d48858a23514b174e9811"
    key: "%{alias('s3_key_juno')}"
    password: "%{alias('restic_password')}"
    host: "objets.juno.calculquebec.ca"
    bucket: "cq-backup-evolo%{lookup('suffix')}"
    backup_path: "/tutor/.local/share/tutor/env/backup/"
    backup_timer: Mon..Sun 4:00:00
    enable_forget: true
    forget_timer: Mon..Sun 5:00:00
    prune: true
    forget:
      keep-last: 1
  restore_edx_repo:
    enable_backup: false
    id: "e0878921516d48858a23514b174e9811"
    key: "%{alias('s3_key_juno')}"
    host: "objets.juno.calculquebec.ca"
    bucket: "cq-backup-evolo"
    password: "%{alias('restic_password')}"
    enable_restore: true
    restore_path: "/backups/prod"
    restore_timer: "Mon..Sun 3:30:00"
  restore_edx_dev_repo:
    enable_backup: false
    id: "e0878921516d48858a23514b174e9811"
    key: "%{alias('s3_key_juno')}"
    host: "objets.juno.calculquebec.ca"
    bucket: "cq-backup-evolo-dev"
    password: "%{alias('restic_password')}"
    enable_restore: true
    restore_path: "/backups/dev"
    restore_timer: "Mon..Sun 3:30:00"
  restore_edx_test_repo:
    enable_backup: false
    id: "e0878921516d48858a23514b174e9811"
    key: "%{alias('s3_key_juno')}"
    host: "objets.juno.calculquebec.ca"
    bucket: "cq-backup-evolo-test"
    password: "%{alias('restic_password')}"
    enable_restore: true
    restore_path: "/backups/test"
    restore_timer: "Mon..Sun 3:30:00"


