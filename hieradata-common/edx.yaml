tutor::version: '22.0.0'
tutor::tutor_contrib_backup_version: '4.5.0'
#tutor::tutor_contrib_backup_source_url: 'git+https://github.com/calculquebec/tutor-contrib-backup'
tutor::aspects_version: '4.0.0'
tutor::admin_email: "noreply@calculquebec.ca"
tutor::admin_password: "%{alias('edx_admin_password')}"

tutor::config:
  LANGUAGE_CODE: "fr"
  PLATFORM_NAME: "evolo"
  CONTACT_EMAIL: "noreply@%{lookup('terraform.data.domain_name')}"
  LMS_HOST: "edx.%{lookup('terraform.data.domain_name')}"
  CMS_HOST: "studio.edx.%{lookup('terraform.data.domain_name')}"
  PREVIEW_LMS_HOST: "preview.edx.%{lookup('terraform.data.domain_name')}"
  ENABLE_WEB_PROXY: "false"
  CADDY_HTTP_PORT: "0.0.0.0:80"
  ENABLE_HTTPS: "true"
  MYSQL_ROOT_PASSWORD: "%{alias('mysql_root_password')}"
  BACKUP_MYSQL_DATABASES: "['openedx']"
  CAIRN_AUTH_ROLES_SYNC_AT_LOGIN: "true"
  INDIGO_WELCOME_MESSAGE: "La plateforme de formation de Calcul Québec"
  RUN_SMTP: "false"
  SMTP_HOST: "%{alias('terraform.instances.login1.local_ip')}"
  SMTP_PORT: "25"
  SMTP_USE_SSL: "false"
  SMTP_USE_TLS: "false"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  ATLAS_REVISION: "main"
  SUPERSET_ENABLE_PROXY_FIX: 'true'
  SUPERSET_OAUTH2_CLIENT_ID: '0jl2Lx79dFlWEyHX'
  SUPERSET_OAUTH2_CLIENT_ID_DEV: 'gyy2vRUreIf7dpI8'
  SUPERSET_OAUTH2_CLIENT_SECRET: "%{alias('superset_oauth2_client_secret')}"
  ASPECTS_ENABLE_PII: 'true'
  ASPECTS_ENABLE_STUDIO_IN_CONTEXT_METRICS: 'true'

tutor::env_patches:
  common-env-features:
    - "'ENABLE_THIRD_PARTY_AUTH': True"
    - "'ENABLE_COMBINED_LOGIN_REGISTRATION': True"
    - "'SHOW_REGISTRATION_LINKS': False"
    - "'CERTIFICATES_HTML_VIEW': True"
    - "'CUSTOM_CERTIFICATE_TEMPLATES_ENABLED': True"
    - "'ENABLE_COOKIE_CONSENT': False"
    - "'ENABLE_EDX_USERNAME_CHANGER': True"
    - "'ENABLE_CREATOR_GROUP': True"
    - "'ENABLE_DATES_COURSE_APP': True"
  openedx-lms-common-settings:
    - "AUTHENTICATION_BACKENDS += ['social_core.backends.open_id_connect.OpenIdConnectAuth']"
    - "LTI_DEFAULT_JUPYTER_HUB_URL = 'https://jupyter.%{lookup('terraform.data.domain_name')}'"
    - "LTI_DEFAULT_JUPYTER_PASSPORT_ID = 'jupyterhub'"
    - "SOCIAL_SHARING_SETTINGS['CUSTOM_COURSE_URLS'] = True"
      #    - "SOCIAL_SHARING_SETTINGS['DASHBOARD_FACEBOOK'] = True"
    - "SOCIAL_SHARING_SETTINGS['CERTIFICATE_FACEBOOK'] = True"
    - "SOCIAL_SHARING_SETTINGS['CERTIFICATE_FACEBOOK_TEXT'] = 'Partager sur Facebook'"
    - "SOCIAL_SHARING_SETTINGS['CERTIFICATE_LINKEDIN'] = True"
      #    - "SOCIAL_SHARING_SETTINGS['CERTIFICATE_LINKEDIN_DEFAULTS_TO_COURSE_ORGANIZATION_NAME'] = True"
    - "SOCIAL_SHARING_SETTINGS['LINKEDIN_COMPANY_ID'] = 5351297"
    - "LINKEDIN_COMPANY_ID = '5351297'"
  openedx-cms-common-settings:
    - "LTI_DEFAULT_JUPYTER_HUB_URL = 'https://jupyter.%{lookup('terraform.data.domain_name')}'"
    - "LTI_DEFAULT_JUPYTER_PASSPORT_ID = 'jupyterhub'"
  openedx-auth:
    - "'SOCIAL_AUTH_OIDC_OIDC_ENDPOINT': 'https://cilogon.org/'"
    - "'SOCIAL_AUTH_OIDC_KEY': 'cilogon:/client_id/4b76e902d5e4d192d630bcfc3823e88f'"
    - "'SOCIAL_AUTH_OIDC_SECRET': '%{lookup('oidc_secret')}'"
    - "'SOCIAL_AUTH_OAUTH_SECRETS': { 'oidc': '%{lookup('oidc_secret')}'}"
  mfe-lms-production-settings:
    - "MFE_CONFIG['ALLOW_PUBLIC_ACCOUNT_CREATION'] = True"
    - "MFE_CONFIG['SHOW_REGISTRATION_LINKS'] = False"
    - "MFE_CONFIG['ENABLE_DYNAMIC_REGISTRATION_FIELDS'] = True"
      #    - "MFE_CONFIG['MARKETING_EMAILS_OPT_IN'] = True"
      #  openedx-common-settings:
      #    - "GOOGLE_ANALYTICS_4_ID = 'G-TWV0D2MS0D'"
  mfe-lms-common-settings:
    - "MFE_CONFIG['EXTERNAL_SCRIPTS'] = {}"
    - "MFE_CONFIG['EXTERNAL_SCRIPTS']['cookieyes'] = 'https://cdn-cookieyes.com/client_data/8e6d217a9bb547e1fbe6dca7733bf748/script.js'"
    - "MFE_CONFIG['EXTERNAL_SCRIPTS']['calculquebec'] = 'https://edx.evolo.calculquebec.cloud/asset-v1:CQ+Assets101+2026+type@asset+block@cq.js'"
    - "FRONTEND_SITE_CONFIG['commonAppConfig']['EXTERNAL_SCRIPTS'] = MFE_CONFIG['EXTERNAL_SCRIPTS']"
    - "MFE_CONFIG['EXTERNAL_STYLESHEETS'] = {}"
    - "MFE_CONFIG['EXTERNAL_STYLESHEETS']['calculquebec'] = 'https://edx.evolo.calculquebec.cloud/asset-v1:CQ+Assets101+2026+type@asset+block@calculquebec.css'"
    - "FRONTEND_SITE_CONFIG['commonAppConfig']['EXTERNAL_STYLESHEETS'] = MFE_CONFIG['EXTERNAL_STYLESHEETS']"
    - "MFE_CONFIG['GOOGLE_ANALYTICS_4_ID'] = 'G-TWV0D2MS0D'"

tutor::openedx_extra_pip_requirements:
  - 'xblocks-extra==1.7.0'
#  - 'xblocks-contrib==1.0.3'
  - 'h5p-xblock==0.2.18'
  - 'jupytermc-xblock @ git+https://github.com/calculquebec/jupytermc-xblock.git@ab2bbd7ec162b7e606dac8b46966ba8909ca09af'
  - 'flow-control-xblock @ git+https://github.com/eduNEXT/flow-control-xblock.git@v2.2.0'
  - 'lti-consumer-xblock @ git+https://github.com/calculquebec/xblock-lti-consumer.git@85ec38410037ab9e3bd23c187972f4c1d608e5a6'
  - 'edx-username-changer==0.5.0'

tutor::plugins:
  mfe:
    dep:
      name: 'tutor-mfe'
      ensure: '22.0.0'
    reboot_on_change: true
  forum:
    dep:
      name: 'tutor-forum'
      ensure: '22.0.0'
    reinit_on_change: true
    reboot_on_change: true
  plugin_slots:
    dep:
      source: 'https://github.com/calculquebec/tutor-plugins/archive/refs/tags/%{lookup("plugin_slots_version")}.tar.gz'
      filename: 'tutor-plugins-%{lookup("plugin_slots_version")}.tar.gz'
    images: ['mfe']
    reboot_on_change: true

plugin_slots_version: 'v22.0.0-29'
theme_version: '22.0.0-30'
tutor::themes:
  indigocq:
    enabled: true
    source_url: 'https://github.com/calculquebec/tutor-plugins/archive/refs/tags/'
    archive_name: 'v%{lookup("theme_version")}.tar.gz'
    extract_options: '--strip-components=3 tutor-plugins-%{lookup("theme_version")}/theming/templates'

